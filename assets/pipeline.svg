<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="t d">
  <title id="t">How one task moves through the crew</title>
  <desc id="d">pattern analyses, mapper plans, hyperfocus builds, literal reviews. Requested changes loop back to hyperfocus for up to three rounds. bodydouble watches the main agent's edits.</desc>
  <style>
    .bg { fill: #EEEAF8; }
    .ink { fill: #1E1B3A; }
    .soft { fill: #5B5480; }
    .h { font: 800 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -0.3px; }
    .lbl { font: 700 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #fff; text-anchor: middle; }
    .sub { font: 600 13.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5B5480; text-anchor: middle; }
    .wire { fill: none; stroke: #1E1B3A; stroke-width: 2.5; stroke-dasharray: 6 7; animation: flow 1.2s linear infinite; }
    .loop { fill: none; stroke: #E4572E; stroke-width: 2.5; stroke-dasharray: 6 7; animation: flow 1.2s linear infinite reverse; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .lid { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .step { fill: none; stroke: #1E1B3A; stroke-width: 4; opacity: 0; animation: step 6s infinite; }
    .s2 { animation-delay: 1.5s; } .s3 { animation-delay: 3s; } .s4 { animation-delay: 4.5s; }
    @keyframes step { 0% { opacity: 0; } 4% { opacity: 1; } 22% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .wire, .loop, .lid, .step { animation: none; } }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E4572E"/></marker></defs>
  <rect class="bg" width="920" height="300" rx="22"/>
  <text class="h ink" x="36" y="48">One prompt, four specialists, up to three review rounds</text>

  <path class="wire" d="M 196 160 H 266"/>
  <path class="wire" d="M 416 160 H 486"/>
  <path class="wire" d="M 636 160 H 706"/>
  <path class="loop" d="M 781 228 C 781 268, 561 268, 561 232" marker-end="url(#ah)"/>
  <text class="sub" x="671" y="290" style="fill:#E4572E">REQUEST_CHANGES loops back, max 3 rounds</text>

  <rect class="step s1" x="40" y="122" width="162" height="76" rx="20"/>
  <rect class="step s2" x="260" y="122" width="162" height="76" rx="20"/>
  <rect class="step s3" x="480" y="122" width="162" height="76" rx="20"/>
  <rect class="step s4" x="700" y="122" width="162" height="76" rx="20"/>
  <g><rect x="46" y="128" width="150" height="64" rx="16" fill="#2A9D8F"/><text class="lbl" x="121" y="166">pattern</text><text class="sub" x="121" y="214">analyse</text></g>
  <g><rect x="266" y="128" width="150" height="64" rx="16" fill="#C77F00"/><text class="lbl" x="341" y="166">mapper</text><text class="sub" x="341" y="214">plan</text></g>
  <g><rect x="486" y="128" width="150" height="64" rx="16" fill="#E4572E"/><text class="lbl" x="561" y="166">hyperfocus</text><text class="sub" x="561" y="214">build</text></g>
  <g><rect x="706" y="128" width="150" height="64" rx="16" fill="#3A6EA5"/><text class="lbl" x="781" y="166">literal</text><text class="sub" x="781" y="214">review</text></g>

  <g transform="translate(560,84)">
    <ellipse cx="0" cy="0" rx="26" ry="15" fill="#8E6CC4"/>
    <ellipse class="lid" cx="0" cy="0" rx="10" ry="10" fill="#fff"/>
    <circle cx="0" cy="0" r="5" fill="#1E1B3A"/>
    <text class="sub" x="44" y="5" style="text-anchor:start">bodydouble watches the main agent's edits</text>
  </g>
</svg>
